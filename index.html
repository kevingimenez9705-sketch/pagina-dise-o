<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipo de Diseño</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <!-- Banner: pendiente definir en qué página va -->
    <section class="banner">
      <div class="banner__left">
        <div class="banner__icon" aria-hidden="true">🎨</div>
        <div>
          <p class="banner__eyebrow">Sistema de Diseño</p>
          <h2 class="banner__title">Panel de <em>Diseño</em></h2>
          <p class="banner__subtitle">Acceso rápido a los proyectos, la guía de marca y los recursos del equipo.</p>
        </div>
      </div>
      <a class="banner__cta" href="#">Ir al Panel de Diseño →</a>
    </section>

    <section class="team-section">
      <h3 class="team-section__title">Nuestro equipo</h3>

      <div class="team-grid">
        <article class="person-card person-card--lead">
          <img class="person-card__avatar" src="assetdise/nazareno-devia.jpg" alt="Nazareno Devia" />
          <h4 class="person-card__name">Nazareno Devia</h4>
          <p class="person-card__role">Diseñador Sr</p>
          <p class="person-card__trait">El cerebro</p>
        </article>

        <article class="person-card">
          <img class="person-card__avatar" src="assetdise/bautista-valle.jpg" alt="Bautista Valle" />
          <h4 class="person-card__name">Bautista Valle</h4>
          <p class="person-card__role">Diseñador Jr</p>
          <p class="person-card__trait">Visual</p>
        </article>

        <article class="person-card">
          <img class="person-card__avatar" src="assetdise/agustin-monteverdi.jpg" alt="Agustín Monteverdi" />
          <h4 class="person-card__name">Agustín Monteverdi</h4>
          <p class="person-card__role">Diseñador Jr</p>
          <p class="person-card__trait">Eficaz</p>
        </article>
      </div>
    </section>
  </div>
</body>
</html>
