<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Equipo de Diseño</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <!-- Banner: pendiente definir en qué página va -->
    <section class="banner">
      <div class="banner__left">
        <div class="banner__icon" aria-hidden="true">🎨</div>
        <div>
          <p class="banner__eyebrow">Sistema de Diseño</p>
          <h2 class="banner__title">Panel de <em>Diseño</em></h2>
          <p class="banner__subtitle">Acceso rápido a los proyectos, la guía de marca y los recursos del equipo.</p>
        </div>
      </div>
      <a class="banner__cta" href="#">Ir al Panel de Diseño →</a>
    </section>

    <section class="team-block">
      <h3 class="team-block__title">
        <span class="team-block__icon">🎨</span>
        Diseño
      </h3>

      <!-- Card del líder del equipo -->
      <div class="lead-card">
        <div class="avatar avatar--lg" aria-hidden="true">ND</div>
        <div class="lead-card__info">
          <span class="lead-card__label">Diseño</span>
          <div class="lead-card__name-row">
            <h4 class="lead-card__name">Nazareno Devia</h4>
            <span class="lead-card__nickname">El cerebro</span>
          </div>
          <p class="lead-card__role">Diseñador Sr</p>
        </div>
      </div>

      <!-- Cards de los miembros junior -->
      <div class="member-grid">
        <div class="member-card">
          <div class="avatar avatar--sm" aria-hidden="true">BV</div>
          <h5 class="member-card__name">Bautista Valle</h5>
          <p class="member-card__role">Diseñador Jr</p>
          <p class="member-card__trait">Visual</p>
        </div>
        <div class="member-card">
          <div class="avatar avatar--sm" aria-hidden="true">AM</div>
          <h5 class="member-card__name">Agustín Monteverdi</h5>
          <p class="member-card__role">Diseñador Jr</p>
          <p class="member-card__trait">Eficaz</p>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
